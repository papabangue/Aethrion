<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jogar Aethrion</title>
<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#07050d;color:#ece6f5;font-family:Nunito,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#unity-canvas{background:#000;display:block;outline:none}
#load{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#07050d url(img/keyart.jpg) center/cover;transition:opacity .6s}
#load::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#07050d55,#07050df0 75%)}
#load>*{position:relative}
#load img{width:min(460px,80vw)}
.bar{width:min(480px,80vw);height:16px;margin-top:26px;border-radius:10px;background:#0009;border:2px solid #a8761f;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9962c,#ffd77a);transition:width .2s}
#msg{margin-top:12px;font-weight:800;text-shadow:0 2px 8px #000}
#tip{margin-top:6px;color:#bdb5d3;font-size:14px;max-width:560px;text-align:center;text-shadow:0 2px 8px #000}
#bar{position:fixed;left:50%;top:6px;transform:translate(-50%,-140%);z-index:6;display:flex;gap:8px;transition:transform .25s}
#bar.show{transform:translate(-50%,0)}
#hot{position:fixed;left:0;right:0;top:0;height:14px;z-index:6}
#bar a,#bar button{font:800 13px Nunito,sans-serif;color:#2a1606;background:linear-gradient(#ffd77a,#d9962c);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;opacity:.85}
#bar a:hover,#bar button:hover{opacity:1}
#err{display:none;position:fixed;inset:0;z-index:9;background:#07050df2;align-items:center;justify-content:center;text-align:center;padding:30px}
#err div{max-width:560px}
#err h2{font-family:Cinzel,serif;color:#f0bd52}
#err a{color:#6fd8f5}
</style>
</head>
<body>
<div id="stage"><canvas id="unity-canvas" width="1280" height="720" tabindex="-1"></canvas></div>

<div id="load">
  <img src="img/logo.png" alt="Aethrion">
  <div class="bar"><i id="prog"></i></div>
  <div id="msg">Preparando o reino… 0%</div>
  <div id="tip">Na primeira vez o jogo baixa uns 180 MB. Depois fica guardado e abre bem mais rápido.</div>
</div>

<div id="hot"></div>
<div id="bar">
  <a href="index.html">← Site</a>
  <button id="fs">Tela cheia</button>
</div>

<div id="err"><div><h2>Ops, o jogo não abriu</h2><p id="errtxt"></p><p>Tente pelo Chrome, Edge ou Firefox no computador e recarregue a página.<br><a href="index.html">Voltar ao site</a></p></div></div>

<script>
const VERSAO = "0.9.0-beta";

const canvas = document.getElementById("unity-canvas");
const load = document.getElementById("load");
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

// mantém 16:9 ocupando a janela inteira
function fit(){
  const w = innerWidth, h = innerHeight, r = 16/9;
  let cw = w, ch = w / r; if (ch > h) { ch = h; cw = h * r; }
  canvas.style.width = Math.floor(cw) + "px"; canvas.style.height = Math.floor(ch) + "px";
}
addEventListener("resize", fit); fit();

function fail(t){
  document.getElementById("errtxt").textContent = t;
  document.getElementById("err").style.display = "flex";
}
if (isMobile) document.getElementById("tip").textContent = "Aviso: o Aethrion foi feito para computador (teclado e mouse). No celular pode ficar pesado.";

const config = {
  arguments: [],
  dataUrl: "Build/AethrionWeb.data.unityweb",
  frameworkUrl: "Build/AethrionWeb.framework.js.unityweb",
  codeUrl: "Build/AethrionWeb.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "Aethrion Studio",
  productName: "Aethrion",
  productVersion: VERSAO,
  showBanner: (m, type) => { if (type === "error") fail(m); else console.log(m); },
};
if (isMobile) config.devicePixelRatio = 1;

function setProg(p, txt){
  const pc = Math.max(0, Math.min(100, Math.round(p * 100)));
  document.getElementById("prog").style.width = pc + "%";
  document.getElementById("msg").textContent = txt + " " + pc + "%";
}

// O arquivo grande do jogo fica dividido em pedaços de 20 MB (limite do Cloudflare Pages).
// Aqui baixamos os pedaços (3 de cada vez) e juntamos de novo antes de abrir o jogo.
async function juntarDados(){
  let info;
  try { const r = await fetch("Build/partes.json", {cache: "no-cache"}); if (!r.ok) return; info = await r.json(); }
  catch (e) { return; }
  const total = info.bytes, partes = new Array(info.partes), recebido = new Array(info.partes).fill(0);
  const atualiza = () => setProg(recebido.reduce((a, b) => a + b, 0) / total * .85, "Baixando o reino…");
  async function baixa(i){
    for (let tentativa = 0; tentativa < 3; tentativa++){
      try {
        const r = await fetch("Build/" + info.arquivo + ".part" + i + "?v=" + VERSAO);
        if (!r.ok) throw new Error("HTTP " + r.status);
        const leitor = r.body.getReader(), pedacos = [];
        recebido[i] = 0;
        for (;;) { const {done, value} = await leitor.read(); if (done) break; pedacos.push(value); recebido[i] += value.length; atualiza(); }
        partes[i] = new Blob(pedacos); return;
      } catch (e) { if (tentativa === 2) throw e; await new Promise(ok => setTimeout(ok, 1500)); }
    }
  }
  let prox = 0;
  const trabalhador = async () => { while (prox < info.partes) await baixa(prox++); };
  await Promise.all([trabalhador(), trabalhador(), trabalhador()]);
  config.dataUrl = URL.createObjectURL(new Blob(partes));
}

const s = document.createElement("script");
s.src = "Build/AethrionWeb.loader.js";
s.onerror = () => fail("Não foi possível baixar os arquivos do jogo.");
s.onload = async () => {
  try { await juntarDados(); } catch (e) { fail("A internet caiu no meio do download. Recarregue a página para tentar de novo."); return; }
  createUnityInstance(canvas, config, p => setProg(.85 + p * .15, p < 1 ? "Abrindo o reino…" : "Quase lá…"))
  .then(inst => {
    load.style.opacity = 0; setTimeout(() => load.remove(), 700);
    canvas.focus();
    document.getElementById("fs").onclick = () => inst.SetFullscreen(1);
  }).catch(e => fail(String(e)));
};
document.body.appendChild(s);

// botões do site só aparecem com o mouse no topo da tela (não cobrem o jogo)
const bar = document.getElementById("bar"); let esconde;
const mostra = () => { bar.classList.add("show"); clearTimeout(esconde); esconde = setTimeout(() => bar.classList.remove("show"), 2500); };
document.getElementById("hot").addEventListener("mouseenter", mostra);
bar.addEventListener("mouseenter", () => clearTimeout(esconde));
bar.addEventListener("mouseleave", mostra);
mostra();
</script>
</body>
</html>
